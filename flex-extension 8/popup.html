<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 290px; padding: 12px; margin: 0; }
  h3 { margin: 0 0 10px; font-size: 15px; }
  label { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; }
  textarea { font: inherit; width: 100%; height: 100px; box-sizing: border-box; }
  .muted { color: #666; font-size: 11px; }
</style>
</head>
<body>
  <h3>FLEX Helper</h3>
  <label>Dark mode <input type="checkbox" id="dark"></label>
  <div><b>Homepage alerts</b> <span class="muted">(loads these pages in the background when you open the homepage. Turn on one at a time; if FLEX logs you out, turn it off.)</span></div>
  <label>Attendance <input type="checkbox" id="bgAttendance"></label>
  <label>Marks <input type="checkbox" id="bgMarks"></label>
  <label>Transcript <input type="checkbox" id="bgTranscript"></label>
  <label>Voice language <select id="voiceLang"><option value="en-US">English (US)</option><option value="en-IN">English (India/Pakistan)</option><option value="ur-PK">اردو</option></select></label>
  <label>Fill comment boxes in feedback <input type="checkbox" id="fillComments"></label>
  <div>Random comments (one per line)</div>
  <textarea id="comments"></textarea>
  <p class="muted">Feedback is filled but never submitted. Review before you press Submit.</p>
  <script src="popup.js"></script>
</body>
</html>
